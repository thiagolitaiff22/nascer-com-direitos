<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="robots" content="noindex">
<title>Nascer com Direitos</title>
<link rel="manifest" href="campo.webmanifest">
<!-- iPhone: abre em tela cheia pelo ícone da Tela de Início -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nascer com Direitos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="icon" type="image/png" href="img/icone-192.png">
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#111;--ink2:#555;--line:#e3e3e6;--ok:#16a34a;--okbg:#e8f7ee;--warn:#d97706;--red:#dc2626;--pri:#111;--onpri:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#17171a;--ink:#f2f2f3;--ink2:#a1a1aa;--line:#2a2a2e;--okbg:#0f2a19;--pri:#f2f2f3;--onpri:#111}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.ava{width:44px;height:44px;border-radius:50%;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
header b{display:block;font-size:18px}
header span{font-size:14px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc{position:relative;border:2px dashed var(--line);background:var(--card);border-radius:16px;min-height:150px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer;color:inherit;font:inherit;overflow:hidden}
.doc.req{border-color:#9ca3af}
.doc svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.doc .t{font-weight:700;font-size:15px}
.doc .s{font-size:12.5px;color:var(--ink2)}
.doc.feito{border:2px solid var(--ok);background:var(--okbg)}
.doc .thumbs{position:absolute;inset:0;display:flex}
.doc .thumbs img{flex:1;min-width:0;object-fit:cover;opacity:.9}
.doc .marca{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;border-radius:10px;padding:6px 8px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.doc .marca svg{width:18px;height:18px;stroke:#4ade80;stroke-width:3}
.doc .apagar{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;line-height:34px;z-index:2}
.doc .estrela{position:absolute;top:8px;left:10px;color:var(--red);font-weight:800;font-size:20px}
.fone{margin:16px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}
.fone svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.fone input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;font-size:20px;letter-spacing:.5px;outline:none}
.barra{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.enviar{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:528px;margin:0 auto;height:64px;border:0;border-radius:18px;background:var(--ok);color:#fff;font:inherit;font-size:20px;font-weight:800}
.enviar svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2.4}
.enviar[disabled]{background:#9ca3af}
.sec{margin:26px 0 10px;font-weight:700;font-size:15px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.lista{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lista div{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-size:15px}
.lista div:first-child{border-top:0}
.lista i{width:12px;height:12px;border-radius:50%;flex:none;background:#9ca3af}
.lista i.ok{background:var(--ok)}.lista i.warn{background:var(--warn)}.lista i.blue{background:#a07a45}
.lista small{margin-left:auto;color:var(--ink2);font-size:13px;white-space:nowrap}
.aviso{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.aviso b{display:block;font-size:19px;margin-bottom:6px}
.som{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:50%;width:44px;height:44px;margin-left:auto;display:grid;place-items:center}
.som svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.tela{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:10}
.tela > div{background:var(--card);border-radius:20px;padding:24px;max-width:420px;width:100%;text-align:center}
.tela svg{width:64px;height:64px;fill:none;stroke-width:2}
.tela b{display:block;font-size:21px;margin:10px 0 6px}
.tela p{margin:0 0 16px;color:var(--ink2)}
.tela button{width:100%;height:56px;border:0;border-radius:14px;font:inherit;font-size:18px;font-weight:700;background:var(--pri);color:var(--onpri);margin-top:8px}
.tela button.sec2{background:transparent;color:var(--ink);border:1px solid var(--line)}
.prog{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.prog span{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
input[type=file]{display:none}
.entrar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;margin-top:24px}
.entrar details summary{cursor:pointer;text-align:center}
.dados{display:grid;gap:10px;margin:0 0 16px}
.dados .fone{margin:0}
.dados .fone.falta{border-color:var(--red)}
.dados .fone input{font-size:18px}
/* câmera com enquadramento */
.cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam video.espelho{transform:scaleX(-1)}
.cam .moldura{position:absolute;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none}
.cam .moldura.oval{border-radius:50%}
.cam .moldura i{position:absolute;width:28px;height:28px;border:5px solid #4ade80}
.cam .moldura i:nth-child(1){left:-5px;top:-5px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.cam .moldura i:nth-child(2){right:-5px;top:-5px;border-left:0;border-bottom:0;border-top-right-radius:14px}
.cam .moldura i:nth-child(3){left:-5px;bottom:-5px;border-right:0;border-top:0;border-bottom-left-radius:14px}
.cam .moldura i:nth-child(4){right:-5px;bottom:-5px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.cam .moldura.oval i{display:none}
.cam .dica{position:absolute;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));color:#fff;text-align:center;font-weight:700;font-size:17px;text-shadow:0 1px 3px #000}
.cam .dica small{display:block;font-weight:500;font-size:14px;opacity:.85;margin-top:2px}
.cam .ctl{position:absolute;left:0;right:0;bottom:0;padding:16px 20px calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between}
.cam .ctl button{border:0;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-weight:700;border-radius:14px;height:48px;padding:0 14px;min-width:92px}
.cam .ctl .disparo{width:78px;height:78px;min-width:0;padding:0;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35)}
.cam .ctl .disparo:active{transform:scale(.94)}
/* conferir a foto */
.ver{position:fixed;inset:0;background:#000;z-index:21;display:flex;flex-direction:column}
.ver .topo{color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;font-weight:700;font-size:17px;text-align:center}
.ver .topo small{display:block;font-weight:500;opacity:.8;font-size:14px}
.ver .fotos{flex:1;overflow:auto;padding:8px 12px;display:grid;gap:12px;align-content:start;touch-action:pan-x pan-y pinch-zoom}
.ver .fotos figure{margin:0;position:relative}
.ver .fotos img{width:100%;display:block;border-radius:8px;background:#222}
.ver .fotos figcaption{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);color:#fff;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700}
.ver .fotos .tira{position:absolute;right:8px;top:8px;border:0;background:rgba(220,38,38,.9);color:#fff;border-radius:8px;height:34px;padding:0 10px;font:inherit;font-size:14px;font-weight:700}
.ver .ctl{display:grid;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.ver .ctl button{height:56px;border:0;border-radius:14px;font:inherit;font-size:18px;font-weight:800}
.ver .ctl .boa{background:var(--ok);color:#fff}
.ver .ctl .denovo{background:rgba(255,255,255,.15);color:#fff}
.ver .ctl .linha{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* recorte do documento */
.rec{position:fixed;inset:0;background:#000;z-index:22;display:flex;flex-direction:column;touch-action:none}
.rec .topo{color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;font-weight:700;font-size:17px;text-align:center}
.rec .topo small{display:block;font-weight:500;opacity:.8;font-size:14px}
.rec .area{flex:1;position:relative;margin:8px 14px}
.rec canvas{position:absolute}
.rec svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rec polygon{fill:none;stroke:#4ade80;stroke-width:2}
.rec circle{fill:none;stroke:#4ade80;stroke-width:3}
.rec .ctl{display:grid;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.rec .ctl button{height:56px;border:0;border-radius:14px;font:inherit;font-size:18px;font-weight:800}
.rec .ctl .boa{background:var(--ok);color:#fff}
.rec .ctl .linha{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec .ctl .linha button{background:rgba(255,255,255,.15);color:#fff;font-size:16px}

/* ---------- mesmo visual do sistema (BI) ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{font-size:15px}
.wrap{max-width:none;padding:0}
.topo{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.topo .logo{width:36px;height:36px;border-radius:4px;background:#16a34a;display:grid;place-items:center;flex:none}
.topo .logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
.topo .quem{min-width:0}
.topo .quem b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .quem span{display:block;font-size:12.5px;color:var(--ink2)}
.sinc{margin-left:auto;flex:none;font-size:12px;font-weight:600;padding:5px 9px;border:1px solid var(--line);border-radius:4px;display:flex;gap:6px;align-items:center;color:var(--ink2);background:var(--card)}
.sinc i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sinc.off i{background:var(--warn)}
.vista{max-width:560px;margin:0 auto;padding:14px 16px calc(84px + env(safe-area-inset-bottom))}
.vista.novo{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
.abas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.abas button{position:relative;border:0;background:none;color:var(--ink2);font:inherit;font-size:12px;font-weight:600;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.abas svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.abas button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}
.abas .bolha{position:absolute;top:5px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#111;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.barra{bottom:calc(58px + env(safe-area-inset-bottom));padding:10px 16px 10px}
.ola{margin:2px 0 14px}
.ola b{display:block;font-size:20px;line-height:1.25}
.ola span{font-size:13px;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-bottom:2px solid var(--c, var(--line2));border-radius:4px;padding:12px 12px 10px;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow);min-width:0}
.kpi small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:28px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.todo{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between}
.kpi.todo b{margin:0}
.funil{display:flex;height:10px;border-radius:4px;overflow:hidden;background:var(--soft);margin:12px 0 6px}
.funil span{display:block;height:100%}
.legenda{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2)}
.legenda i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.aviso-fila{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:4px;padding:12px;margin-bottom:12px}
.aviso-fila b{display:block;font-size:14.5px}
.aviso-fila span{font-size:12.5px;color:var(--ink2)}
.aviso-fila button{margin-left:auto;flex:none;border:1px solid var(--line2);background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:13px;border-radius:4px;padding:8px 10px}
.auds{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
.auds > div{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.auds > div:first-child{border-top:0}
.auds .dia{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:4px;padding:4px 0}
.auds .dia b{display:block;font-size:19px;line-height:1.1}
.auds .dia span{display:block;font-size:11px;text-transform:uppercase;color:var(--ink2);font-weight:600}
.auds .info{min-width:0;flex:1}
.auds .info b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.auds .info span{font-size:12.5px;color:var(--ink2)}
.lig{flex:none;border:1px solid var(--line2);border-radius:4px;padding:7px 10px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.lig svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.vazio{background:var(--card);border:1px dashed var(--line2);border-radius:4px;padding:16px;text-align:center;color:var(--ink2);font-size:13.5px}
.busca{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:4px;padding:0 12px;box-shadow:var(--shadow)}
.busca svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2;flex:none}
.busca input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;font-size:16px;padding:12px 0;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:12.5px;font-weight:600;border-radius:4px;padding:6px 10px;white-space:nowrap}
.chips button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chips button b{margin-left:4px;font-variant-numeric:tabular-nums}
.lista > div{cursor:pointer}
.lista .nm{min-width:0;flex:1}
.lista .nm b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.lista .nm span{display:block;font-size:12.5px;color:var(--ink2)}
.lista small{text-align:right;white-space:normal!important;max-width:42%}
.lista > div:has(i.red){box-shadow:inset 3px 0 0 var(--red)}
.lista > div:has(i.red) small{color:var(--red)}
.lista > div:has(i.gray) small{color:var(--ink2)}
.folha{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.folha > div{width:100%;max-width:560px;margin:0 auto;background:var(--bg);border-top:1px solid var(--line);border-radius:4px 4px 0 0;max-height:88vh;overflow:auto;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.folha .puxa{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.folha h3{margin:0;font-size:18px;line-height:1.3}
.folha .sub{font-size:13px;color:var(--ink2);margin:4px 0 12px}
.folha .acoes{display:flex;gap:8px;margin-bottom:14px}
.folha .acoes a,.folha .acoes button{flex:1;justify-content:center}
.tempo{list-style:none;margin:0;padding:0}
.tempo li{position:relative;display:grid;grid-template-columns:22px 1fr;gap:10px;padding-bottom:16px}
.tempo li:not(:last-child)::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tempo li.feito:not(:last-child)::before{background:var(--ok)}
.tempo .pt{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);display:grid;place-items:center}
.tempo .feito .pt{border-color:var(--ok);background:var(--ok)}
.tempo .feito .pt svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3}
.tempo .atual .pt{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.18)}
.tempo .ruim .pt{border-color:var(--red);background:var(--red)}
.tempo b{display:block;font-size:14.5px}
.tempo span{font-size:13px;color:var(--ink2)}
.sair{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:22px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:14px;font-weight:600;border-radius:4px;padding:12px}
.sair svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.versao{text-align:center;font-size:12px;color:var(--ink2);margin-top:10px}
.doc{min-height:118px}
@media (max-width:350px){ .kpi b{font-size:24px} .doc .s{display:none} }
:root{--bg:#ffffff;--card:#ffffff;--soft:#f4f4f5;--ink:#09090b;--ink2:#52525b;--line:#e4e4e7;--line2:#d4d4d8;--ok:#10b981;--okbg:rgba(16,185,129,.1);--warn:#f59e0b;--red:#ef4444;--blue:#3b82f6;--pri:#18181b;--onpri:#fafafa;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--card:#18181b;--soft:#1f1f23;--ink:#fafafa;--ink2:#a1a1aa;--line:#2a2a2e;--line2:#3f3f46;--ok:#34d399;--okbg:rgba(52,211,153,.12);--warn:#fbbf24;--red:#f87171;--blue:#60a5fa;--pri:#fafafa;--onpri:#18181b;--shadow:none}}
html,body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.doc,.fone,.lista,.enviar,.aviso,.entrar,.tela > div,.tela button,.som,.ver .ctl button,.rec .ctl button,.cam .ctl button:not(.disparo),.doc .marca,.doc .apagar,.ver .fotos img,.ver .fotos .tira,.ver .fotos figcaption{border-radius:4px!important}
header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
header .ava{border-radius:4px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.sec,.rot{font-size:12.5px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:20px 0 8px}
.fone{border:1px solid var(--line2);box-shadow:var(--shadow)}
.fone.falta{border-color:var(--red)}
.fone svg{color:var(--ink2)}

.topo .quem b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.topo .quem span{font-size:12.5px;color:var(--ink2)}
.tema{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--gline);background:var(--card);color:var(--ink2);display:grid;place-items:center;padding:0}
.tema svg{width:19px;height:19px}
.tema .lua{display:none}
html[data-tema="dark"] .tema .sol{display:none}
html[data-tema="dark"] .tema .lua{display:inline}
.sinc{background:var(--card)!important}
/* boas-vindas e destaque */
.ola b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.hero{border-radius:22px!important;padding:20px 20px 18px!important;background:linear-gradient(140deg,#a58049,#8f6f40)!important;box-shadow:0 10px 26px rgba(138,106,61,.22)!important}
.hero::after{display:none!important}
.hero .num{font-size:60px!important;font-weight:600!important}
.hero .lin{margin-top:6px}
/* cartões de indicadores: simples, rótulo normal, sem barra colorida */
.kpis{gap:12px!important}
.kpi{border-radius:18px!important;padding:16px!important;box-shadow:var(--sombra-leve,0 1px 3px rgba(60,45,20,.05))!important}
.kpi::before{display:none!important}
.kpi small{font-size:13px!important;font-weight:600;text-transform:none!important;letter-spacing:0!important;color:var(--ink2)!important;white-space:normal!important}
.kpi b{font-size:30px!important;font-weight:700!important;color:var(--ink)!important;margin-top:8px!important}
.kpi small::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--line2));margin-right:7px;vertical-align:1px}
.funil{height:8px!important;border-radius:6px!important}
.legenda{display:none!important}
.rot{font-size:13px!important;letter-spacing:0!important;text-transform:none!important;font-weight:700;color:var(--ink)!important}
/* listas e formulários */
.lista,.vazio,.aviso-fila{border-radius:18px!important;box-shadow:var(--sombra-leve,0 1px 3px rgba(60,45,20,.05))!important}
.busca,.fone,.doc,.chips button{box-shadow:none!important}
.doc{border-radius:18px!important}
.abas{box-shadow:0 8px 24px rgba(60,45,20,.12)!important}
.sair{font-weight:600}
.versao{font-size:12px;color:var(--ink2)}
/* ---------- modo escuro (dourado sobre marrom-carvão, igual ao BI) ---------- */
html[data-tema="dark"]:root:not([x]){color-scheme:dark;--bg:#14110d;--card:#1b1712;--soft:#211c16;--ink:#f8f2e8;--ink2:#cfc1a3;--line:#3a3226;--line2:#4b4132;--okbg:rgba(34,197,94,.14);--ok:#4ade80;--warn:#fbbf24;--red:#f87171;--blue:#a5b4fc;--shadow:none;--sombra-leve:none;--gsoft:rgba(212,180,131,.12);--gline:#2e2820}
html[data-tema="dark"],html[data-tema="dark"] body{background:#14110d!important;color:var(--ink)}
html[data-tema="dark"] .topo .logo img{filter:brightness(1.55) saturate(1.05) drop-shadow(0 2px 8px rgba(0,0,0,.45))}
html[data-tema="dark"] .sinc,html[data-tema="dark"] .tema,html[data-tema="dark"] .kpi,html[data-tema="dark"] .lista,html[data-tema="dark"] .auds,html[data-tema="dark"] .vazio,html[data-tema="dark"] .aviso-fila,html[data-tema="dark"] .lig,html[data-tema="dark"] .aviso-fila button,html[data-tema="dark"] .sair,html[data-tema="dark"] .busca,html[data-tema="dark"] .chips button,html[data-tema="dark"] .fone,html[data-tema="dark"] .doc,html[data-tema="dark"] .abas,html[data-tema="dark"] .entrar,html[data-tema="dark"] .tela > div,html[data-tema="dark"] .login .fone,html[data-tema="dark"] .folha > div,html[data-tema="dark"] .tempo .pt{background:#1b1712!important;border-color:#2e2820!important;color:var(--ink)!important;box-shadow:none!important}
html[data-tema="dark"] .abas{box-shadow:0 10px 28px rgba(0,0,0,.5)!important}
html[data-tema="dark"] .abas button{color:var(--ink2)}
html[data-tema="dark"] .abas button[aria-current="true"],html[data-tema="dark"] .abas button[data-aba="novo"]{color:#d4b483}
html[data-tema="dark"] .abas button[data-aba="novo"] svg{background:linear-gradient(135deg,#c9a46a,#a98650)!important;color:#1b1712!important;box-shadow:0 8px 20px rgba(0,0,0,.4),0 0 0 6px #14110d!important}
html[data-tema="dark"] .kpi b{color:var(--ink)!important}
html[data-tema="dark"] .chips button[aria-pressed="true"]{background:#c9a46a!important;border-color:#c9a46a!important;color:#1b1712!important}
html[data-tema="dark"] .doc.feito{background:rgba(34,197,94,.1)!important;border-color:rgba(74,222,128,.5)!important}
html[data-tema="dark"] .doc svg,html[data-tema="dark"] .fone svg{color:#d4b483}
html[data-tema="dark"] .enviar[disabled]{background:#2a241b!important;color:#8a7c64!important}
html[data-tema="dark"] .enviar:not([disabled]){background:linear-gradient(135deg,#c9a46a,#a98650)!important;color:#1b1712!important}
html[data-tema="dark"] .enviar:not([disabled]) svg{stroke:#1b1712}
html[data-tema="dark"] .barra{background:linear-gradient(rgba(20,17,13,0),#14110d 40%)!important}
html[data-tema="dark"] .aviso-docs{background:rgba(251,191,36,.1)!important;border-color:rgba(251,191,36,.35)!important;color:var(--ink)!important}
html[data-tema="dark"] .login-logo{background:none!important;box-shadow:none!important}
html[data-tema="dark"] input,html[data-tema="dark"] textarea,html[data-tema="dark"] select{color:var(--ink);background:transparent}
html[data-tema="dark"] ::placeholder{color:#7d705a}
html[data-tema="dark"] .lista > div + div,html[data-tema="dark"] .lista > div{border-color:#2e2820!important}
html[data-tema="dark"] .hero{background:linear-gradient(140deg,#7d6038,#5f4829)!important}

/* ---------- legibilidade: letra maior e contraste forte nos dois modos ---------- */
html,body{font-size:16px}
.topo .quem b{font-size:17px!important}
.topo .quem span{font-size:13px!important}
.ola span{font-size:14px!important;color:var(--ink2)!important}
.hero small{font-size:14px!important}
.hero .lin{font-size:14px!important}
.kpi small{font-size:14px!important;line-height:1.25}
.kpi b{font-size:32px!important}
.aviso-docs b{font-size:16px!important}
.aviso-docs small{font-size:13.5px!important;color:var(--ink2)!important}
.lista b,.lista strong{font-size:16px}
.lista small,.lista span{font-size:14px}
.chips button{font-size:14.5px!important;padding:9px 14px!important}
.busca input,.fone input{font-size:16px!important}
.doc .t{font-size:15px!important;font-weight:700}
.doc .s{font-size:13px!important;color:var(--ink2)!important}
.abas button{font-size:12.5px!important;font-weight:600}
.rot{font-size:14px!important}
html[data-tema="dark"] .kpi small,html[data-tema="dark"] .ola span,html[data-tema="dark"] .topo .quem span,html[data-tema="dark"] .aviso-docs small,html[data-tema="dark"] .doc .s,html[data-tema="dark"] .versao{color:#cfc1a3!important}
html[data-tema="dark"] .topo .quem b,html[data-tema="dark"] .ola b,html[data-tema="dark"] .kpi b,html[data-tema="dark"] .rot,html[data-tema="dark"] .lista b,html[data-tema="dark"] .doc .t{color:#f8f2e8!important}
html[data-tema="dark"] .aviso-docs .n{background:#d97706!important;color:#14110d!important}
html[data-tema="dark"] .abas button{color:#cfc1a3!important}
html[data-tema="dark"] .abas button[aria-current="true"]{color:#e0c48f!important}
html[data-tema="dark"] ::placeholder{color:#9c8f77!important}

/* ---------- documentos: obrigatórios e "quando possível" ---------- */
.grupo-opc{margin-top:22px}
.grupo-opc .rot small{font-weight:500;color:var(--ink2);margin-left:6px}
.doc.opc{border-style:dashed!important}
.video-mini{background:#7c3aed!important;font-size:13px!important;letter-spacing:.04em}

/* cabeçalho com fundo sólido: nada passa por baixo dele ao rolar */
.topo{background:var(--bg)!important;border-bottom:1px solid var(--gline,var(--line))!important;position:sticky;top:0;z-index:8;padding:8px 12px 8px!important;margin:0 -16px 6px;backdrop-filter:saturate(1.2)}
html[data-tema="dark"] .topo{background:#14110d!important;border-bottom-color:#2e2820!important}

/* etiqueta "Obrigatório": legível, no fluxo do cartão (não cobre o ícone) */
.doc .estrela{position:static!important;display:inline-flex;align-items:center;align-self:flex-start;margin:0 0 8px!important;padding:4px 10px!important;border-radius:999px;background:#fdecc8!important;color:#7a4a05!important;font-size:12.5px!important;font-weight:700!important;letter-spacing:0!important;text-transform:none!important;line-height:1.1}
.doc .estrela::after{content:"Obrigatório"!important;font-weight:700!important}
.doc.req{padding-top:12px}
html[data-tema="dark"] .doc .estrela{background:rgba(251,191,36,.2)!important;color:#fde68a!important}

/* ---------- lista de clientes: calma, uma cor só; a situação vira uma etiqueta discreta ---------- */
.lista > div{box-shadow:none!important;padding:15px 16px!important;gap:12px}
.lista > div::before{display:none!important}
.lista .nm b{font-size:16px!important;font-weight:600;color:var(--ink)!important}
.lista .nm span{font-size:13.5px!important;color:var(--ink2)!important}
.lista .nm .falta-l{color:var(--warn)!important;font-weight:500!important;margin-top:2px}
.lista small{display:inline-flex!important;align-items:center;gap:7px;flex:none;max-width:46%;padding:6px 12px;border-radius:999px;background:var(--gsoft,#f8f1e4);color:var(--ink)!important;font-size:13px!important;font-weight:600;text-align:left;line-height:1.2}
.lista small::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink2);flex:none}
.lista > div:has(i.ok) small::before{background:var(--ok)}
.lista > div:has(i.warn) small::before,.lista > div:has(i.red) small::before{background:var(--warn)}
.lista > div:has(i.blue) small::before,.lista > div:has(i.teal) small::before,.lista > div:has(i.indigo) small::before,.lista > div:has(i.purple) small::before{background:var(--g1,#a07a45)}
.lista > div:has(i.ok) small,.lista > div:has(i.warn) small,.lista > div:has(i.blue) small,.lista > div:has(i.red) small,.lista > div:has(i.teal) small,.lista > div:has(i.indigo) small,.lista > div:has(i.purple) small,.lista > div:has(i.gray) small{color:var(--ink)!important}
html[data-tema="dark"] .lista small{background:rgba(212,180,131,.12)!important;color:#f8f2e8!important}
html[data-tema="dark"] .lista .nm .falta-l{color:#fbbf24!important}
html[data-tema="dark"] .lista > div:has(i.ok) small::before{background:#4ade80}

/* ---------- lista de clientes: compacta ---------- */
.lista > div{padding:11px 14px!important;gap:10px}
.lista .nm b{font-size:14.5px!important;font-weight:600}
.lista .nm span{font-size:12.5px!important}
.lista small{padding:5px 10px!important;font-size:12px!important;max-width:44%}
.lista small::before{width:7px;height:7px}
.chips button{font-size:13.5px!important;padding:7px 12px!important}
.busca{padding-top:2px;padding-bottom:2px}

/* ---------- só gestantes ---------- */
.fone .rc{white-space:nowrap}

/* ---------- logo bem à vista ---------- */
.topo .logo img{height:62px!important;filter:drop-shadow(0 2px 8px rgba(138,106,61,.28))}
.topo{padding:10px 12px 10px!important}
.login-logo{width:210px!important;max-width:70%!important;height:auto!important;margin:0 auto 22px!important;padding:0!important;background:none!important;box-shadow:none!important;border-radius:0!important;filter:drop-shadow(0 4px 14px rgba(138,106,61,.28))}
html[data-tema="dark"] .login-logo{filter:brightness(1.55) saturate(1.05) drop-shadow(0 4px 14px rgba(0,0,0,.5))}
.login-t{font-size:22px!important;font-weight:700;letter-spacing:-.01em}
.topo{padding:10px 16px 10px!important}

/* ================= tela de entrada: limpa, centralizada e legível nos dois modos ================= */
.login{background:none!important;overflow:visible!important;align-items:center}
.login::before{display:none!important}
.login .entrar,html[data-tema="dark"] .login .entrar{background:none!important;border:0!important;box-shadow:none!important;border-radius:0!important;max-width:360px!important;padding:0!important}
.login-logo{width:170px!important;max-width:60%!important;margin:0 auto 18px!important}
html[data-tema="dark"] .login-logo{filter:brightness(1.35) saturate(.95) drop-shadow(0 4px 14px rgba(0,0,0,.45))!important}
.login-t{font-size:24px!important;margin-top:2px}
.login-s{font-size:15px!important;color:var(--ink2)!important;margin:8px 0 26px!important;line-height:1.5}
.login-rot{font-size:14px!important;font-weight:600!important;color:var(--ink2)!important;margin:0 0 7px 2px!important}
.login .fone{height:52px!important;background:var(--card)!important;border:1px solid var(--line2)!important;border-radius:14px!important}
html[data-tema="dark"] .login .fone{background:#1d1812!important;border-color:#4b4132!important}
.login .fone input{color:var(--ink)!important;font-size:16.5px!important}
.login .fone svg{color:var(--g2,#8a6a3d)!important;opacity:1!important}
html[data-tema="dark"] .login .fone svg{color:#d4b483!important}
html[data-tema="dark"] .login #ver-senha{color:#d4b483!important}
.login .enviar{height:54px!important;margin-top:24px!important;font-size:17px!important;border-radius:14px!important}
.login-nota{font-size:13.5px!important;color:var(--ink2)!important;margin:18px 0 0!important;line-height:1.45}
.login details{font-size:14px!important;color:var(--ink2)!important;margin-top:14px!important}
.login details summary{padding:8px 0}
.login details input{color:var(--ink)!important}

/* ================= entrada: tamanhos menores e blocos bem separados ================= */
.login{padding-top:calc(34px + env(safe-area-inset-top))!important;padding-bottom:calc(34px + env(safe-area-inset-bottom))!important}
.login .entrar{max-width:330px!important}
.login-logo{width:128px!important;max-width:44%!important;margin:0 auto 18px!important}
.login-t{font-size:20px!important;margin:0!important}
.login-s{font-size:14px!important;line-height:1.55!important;margin:8px auto 32px!important;max-width:290px;color:var(--ink2)!important}
.login-rot{font-size:13px!important;margin:0 0 8px 2px!important;letter-spacing:.01em}
.login label.login-rot ~ label.login-rot,.login .login-rot + .fone + .login-rot{margin-top:22px!important}
.login .fone{height:48px!important;margin:0!important;padding:0 14px!important;border-radius:12px!important}
.login .fone input{font-size:16px!important}
.login .fone svg{width:18px!important;height:18px!important}
.login .enviar{height:50px!important;font-size:16px!important;margin-top:30px!important;border-radius:12px!important}
.login-nota{font-size:12.5px!important;margin:20px 8px 0!important;line-height:1.5!important;opacity:.95}

/* ---------- prospectador ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:var(--gsoft,#f8f1e4);margin:0 0 12px}
.seg button{border:0;background:none;padding:11px;border-radius:11px;font:inherit;font-weight:600;font-size:14.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(60,45,20,.12)}
.mini-btn{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--g2,#8a6a3d);border-radius:999px;padding:6px 10px;font:inherit;font-size:12.5px;font-weight:600}
.nota-form{font-size:13px;color:var(--ink2);margin:10px 4px 0}
.acesso-caixa{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--gsoft,#f8f1e4);margin:10px 0 14px}
.acesso-caixa span{font-size:13px;color:var(--ink2)}
.acesso-caixa b{font-size:15px;word-break:break-all}
html[data-tema="dark"] .seg{background:rgba(212,180,131,.1)}
html[data-tema="dark"] .seg button[aria-pressed="true"]{background:#2c251c;color:#f8f2e8}
html[data-tema="dark"] .acesso-caixa{background:rgba(212,180,131,.1)}
html[data-tema="dark"] .mini-btn{background:#1b1712;border-color:#4b4132;color:#d4b483}

/* ---------- margens laterais maiores, respeitando a área segura de cada celular ---------- */
:root{--gx:max(22px,env(safe-area-inset-left));--gxr:max(22px,env(safe-area-inset-right))}
.vista{padding-left:var(--gx)!important;padding-right:var(--gxr)!important}
.topo{margin:0 0 6px!important;padding-left:var(--gx)!important;padding-right:var(--gxr)!important}
html,body{overflow-x:hidden}
.folha > div{padding-left:var(--gx)!important;padding-right:var(--gxr)!important}
.barra{padding-left:var(--gx)!important;padding-right:var(--gxr)!important}
.abas{left:var(--gx)!important;right:var(--gxr)!important}
#barra-envio{left:var(--gx)!important;right:var(--gxr)!important}
.tela{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
.ver .topo,.rec .topo,.ver .ctl,.rec .ctl{padding-left:var(--gx)!important;padding-right:var(--gxr)!important}
.lista div{padding:13px 16px!important}
.kpi{padding:14px 16px 12px!important}

/* ---------- escolha de cidade (lista do estado, pesquisa e bandeira) ---------- */
.cid-campo{position:relative;cursor:pointer}
.cid-campo input[readonly]{cursor:pointer;caret-color:transparent}
.cid-seta{width:20px;height:20px;flex:none;color:var(--ink2)}
.cid-flag{width:26px;height:18px;border-radius:3px;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.12);background:#fff}
.cid-flag.vazio{box-shadow:none;background:var(--soft,#f1ece2);opacity:.7;border-radius:4px}
.cid-folha{display:flex;flex-direction:column;max-height:86dvh;max-height:86vh}
.cid-busca{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:16px;background:var(--card,#fff);color:inherit;margin:0 0 10px}
.cid-lista{overflow:auto;-webkit-overflow-scrolling:touch;min-height:120px;flex:1;border:1px solid var(--line);border-radius:14px;background:var(--card,#fff)}
.cid-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;font:inherit;font-size:16px;color:inherit;text-align:left}
.cid-item:first-child{border-top:0}
.cid-item:active,.cid-item.atual{background:var(--gsoft,#f8f1e4)}
.cid-item.atual{font-weight:700}
.cid-vazio{margin:0;padding:18px 14px;color:var(--ink2);font-size:14px;text-align:center}
.cid-cancela{margin-top:12px;height:48px;border-radius:14px;border:1px solid var(--line);background:none;font:inherit;font-weight:600;color:inherit}
.cid-folha .cid-busca{height:48px!important;padding:0 16px!important;border-radius:14px!important;border:1px solid var(--line)!important;font-size:16px!important;display:block;box-sizing:border-box}
.cid-folha .cid-flag{display:block!important;width:26px!important;height:18px!important;min-width:26px;border-radius:3px!important}
.cid-folha .cid-flag.vazio{background:transparent!important;border:1.5px dashed var(--line2,#d8cdb8);box-shadow:none!important;opacity:.8}
.cid-folha .cid-item span:not(.cid-flag){flex:1}

.cid-flag.mini{width:18px;height:12px;border-radius:2px;display:inline-block;vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
/* barras de pesquisa maiores */
.cid-folha .cid-busca{-webkit-appearance:none!important;appearance:none!important;height:56px!important;min-height:56px;padding:0 18px!important;font-size:18px!important;border-radius:16px!important;border:1.5px solid var(--line2,#d8cdb8)!important;background:#fff!important;margin-bottom:12px!important}
.cid-folha .cid-busca::-webkit-search-cancel-button{-webkit-appearance:none}
.cid-folha .cid-busca::placeholder{font-size:18px;color:var(--ink2)}
.cid-folha .cid-item{padding:15px 14px!important;font-size:17px!important}
.busca{min-height:54px;padding-left:16px!important;padding-right:16px!important;border-radius:16px!important}
.busca svg{width:22px!important;height:22px!important}
.busca input{font-size:17px!important;padding:15px 0!important}
.cid-limpar{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft,#f1ece2);color:var(--ink2,#6b5d47);display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0;margin-left:4px}
.cid-limpar svg{width:16px;height:16px;fill:none}
.cid-limpar[hidden]{display:none}
/* data prevista do parto: dentro da caixa, alinhada à direita */
#l-dpp{box-sizing:border-box;width:100%;max-width:100%;overflow:hidden}
#l-dpp .rc{font-size:14px}
#dpp{flex:1 1 0!important;width:0!important;min-width:0!important;text-align:right;font-size:18px!important;letter-spacing:0!important;color:var(--ink)}
#dpp::placeholder{color:var(--ink2);opacity:.7}

/* adaptação a qualquer aparelho: nada passa da largura da tela (de 320 px até tablet) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
img,video,canvas,svg{max-width:100%}
.vista,.wrap,.dados,.lista,.kpis,.grid,.chips,.folha > div,.tela > div{min-width:0;max-width:100%}
.dados > *,.dados .fone,.fone{min-width:0;max-width:100%}
.fone input,.fone select{min-width:0;width:100%;flex:1 1 0}
.grid > *,.kpis > *{min-width:0}
@media (max-width:359px){
  :root{--gx:max(14px,env(safe-area-inset-left));--gxr:max(14px,env(safe-area-inset-right))}
  .doc .t{font-size:14px}
  .kpi b{font-size:22px}
}
@media (min-width:700px){ .vista,.wrap{max-width:640px} .abas{max-width:640px;margin-left:auto;margin-right:auto} }
.dados{grid-template-columns:minmax(0,1fr)}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}

/* parece aplicativo: sem zoom por pinça nem por toque duplo, sem puxar a página para os lados */
html{touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;font-size:max(16px,1em)}
button,a,label,[role=button]{touch-action:manipulation}

      .then(function(r){ return r.text().then(function(t){ var d = null; try { d = JSON.parse(t); } catch(e){} if (!d) throw new Error('o servidor respondeu com erro (' + r.status + ')'); return d; }); })

            function(e){ if (tempo) clearTimeout(tempo); throw new Error(e && e.name === 'AbortError' ? 'o envio demorou demais (internet fraca)' : e && /Failed to fetch|Load failed|NetworkError|network/i.test(e.message) ? 'sem conexão com o servidor' : (e && e.message) || 'falhou'); });

      '<b class="login-t">Nascer com Direitos</b><p class="login-s">Salário-maternidade<br>' + esc(msg || 'Entre com o seu CPF e a senha.') + '</p>' +
      '<label class="login-rot" for="usuario">CPF</label><label class="fone" style="margin:0 0 14px"><svg viewBox="0 0 24 24"><use href="#i-pessoa"/></svg><input id="usuario" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" name="cpf-nc" autocapitalize="none" autocorrect="off" spellcheck="false"></label>' +
      '<label class="login-rot" for="senha">Senha</label><label class="fone" style="margin:0"><svg viewBox="0 0 24 24"><use href="#i-cadeado"/></svg><input id="senha" type="password" placeholder="sua senha" autocomplete="current-password"><button type="button" id="ver-senha" style="border:0;background:none;color:var(--ink2);font:inherit;font-size:14px">mostrar</button></label>' +
      '<button class="enviar" id="entrar">Entrar</button>' +
      '<p class="login-nota"><a href="equipe-cadastro.html" style="color:inherit;font-weight:700">Primeiro acesso</a> &nbsp;·&nbsp; <a href="#" id="esqueci" style="color:inherit;font-weight:700">Esqueci a senha</a></p>' +
      '<p class="login-nota">Precisa de internet só para entrar. Depois o aplicativo funciona sem sinal.</p>' +
      '</div></div>';
    $('usuario').addEventListener('input', function(){ this.value = maskCpf(this.value); });   // só números
    $('esqueci').onclick = function(e){ e.preventDefault(); alert('Esqueceu a senha? Procure o escritório: o gestor redefine e ela volta a ser 123456. No próximo acesso você cria outra.'); };
    $('ver-senha').onclick = function(){ var e = $('senha'); e.type = e.type === 'password' ? 'text' : 'password'; this.textContent = e.type === 'password' ? 'mostrar' : 'esconder'; };
    $('senha').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('entrar').click(); });
    $('entrar').onclick = function(){
      var u = $('usuario').value.trim(), p = $('senha').value, b = this;
      var uCru = u; if (/^[\d.\-\s]+$/.test(u) && u.replace(/\D/g, '').length === 11) u = u.replace(/\D/g, '');   // CPF: só os números
      if (!u || !p) return alert('Digite o usuário e a senha.');
      if (navigator.onLine === false) return alert('Sem internet agora. Para entrar a primeira vez precisa de sinal.');
      b.disabled = true; b.textContent = 'Entrando…';
      fetch(CFG.url + '/rest/v1/rpc/campo_entrar', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_usuario: u, p_senha: p }) })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d.token){
            lsSet('campo_usuario', u); token = d.token;
            if (d.trocar && SENHA_TROCA_OBRIGATORIA) return telaNovaSenha(d.token);   // desligado: vale a senha padrão 123456
            return iniciar();
          }
          // não é parceiro: pode ser um gestor do escritório (usuário e senha do sistema) → vai para o painel do gestor
          return tentarGestor(uCru, p).then(function(foi){
            if (!foi) alert((d && (d.erro || d.message)) || 'Não foi possível entrar.');
          });
        })
        .catch(function(){ alert('Sem internet agora. Para entrar a primeira vez precisa de sinal.'); })
        .then(function(){ if (document.body.contains(b)){ b.disabled = false; b.textContent = 'Entrar'; } });
    };
    var uu = lsGet('campo_usuario'); if (uu && /^[0-9]{11}$/.test(uu)) $('usuario').value = maskCpf(uu);   // só CPF; nomes antigos não voltam
  }
  // aplicativo ainda sem o endereço do Supabase (CFG lá em cima): avisa em vez de tentar entrar
  function semConfiguracao(){
    $('app').innerHTML = '<div class="login"><div class="entrar"><b class="login-t">Nascer com Direitos</b><p class="login-s">Salário-maternidade</p>' +
      '<div class="aviso"><b>Aplicativo ainda não configurado</b>O escritório precisa colocar o endereço e a chave do Supabase no campo.html (os mesmos do config.js). Avise o escritório.</div></div></div>';
  }
  function iniciar(){
    if (!CFG_OK) return semConfiguracao();
    if (!token) return pedirLink();
    lsSet('campo_token', token);
    if (location.hash) history.replaceState(null, '', location.pathname);
    try { quem = JSON.parse(lsGet('campo_quem') || 'null'); } catch(e){}
    var semRede = false;
    abrirRascunho().then(function(){
      return fetch(CFG.url + '/rest/v1/rpc/campo_quem', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }) })
        .then(function(r){ return r.json(); }).then(function(d){ if (d && d.prospId){ quem = d; lsSet('campo_quem', JSON.stringify(d)); return quem; } if (d === null){ lsSet('campo_quem', ''); return null; } return quem; })
        .catch(function(){ semRede = true; return quem; });
    }).then(function(q){
      if (!q && !semRede){ lsSet('campo_token', ''); token = ''; return pedirLink('Seu acesso mudou. Entre de novo com o usuário e a senha.'); }
      if (!q) quem = { nome: 'Prospectador', cadastros: [] };   // primeira vez sem internet: cadastra e envia depois
      telaInicial();
      carregarPainel();
      if (quem.envioUrl) proximo();
    });
  }
  iniciar();
  if (!APP && 'serviceWorker' in navigator) navigator.serviceWorker.register('campo-sw.js').catch(function(){});
  if (APP){
    // botão voltar do Android: fecha a tela aberta (câmera, recorte, conferir); na tela inicial, só minimiza
    var Pl = window.Capacitor.Plugins || {};
    if (Pl.App) Pl.App.addListener('backButton', function(){
      var cam = document.querySelector('.cam .fechar'); if (cam) return cam.click();
      var rec = document.querySelector('.rec'); if (rec){ rec.remove(); return; }
      var ver = document.querySelector('.ver .boa'); if (ver) return ver.click();
      var tl = document.querySelector('.tela'); if (tl){ tl.remove(); return; }
      var fo = document.querySelector('.folha'); if (fo){ fo.remove(); return; }
      if (aba !== 'painel') return irPara('painel');
      Pl.App.minimizeApp();
    });
    if (Pl.App) Pl.App.addListener('resume', function(){ proximo(); carregarPainel(); sincronia(); });
    // aviso de versão nova do aplicativo
    fetch('https://thiagolitaiff22.github.io/nascer-com-direitos/app/versao.json?' + Date.now()).then(function(r){ return r.json(); }).then(function(v){
      if (v && (v.apk || v.versao) > APP_VERSAO){ var b = document.createElement('a'); b.href = v.url; b.textContent = 'Nova versão do aplicativo: toque para baixar'; b.style.cssText = 'display:block;background:#a07a45;color:#fff;text-align:center;padding:10px;font-weight:700;text-decoration:none'; document.body.insertBefore(b, document.body.firstChild); }
    }).catch(function(){});
  }
  // iPhone ou navegador (não é o aplicativo Android): se saiu versão nova, recarrega sozinho uma vez para pegar
  if (!window.Capacitor && navigator.onLine !== false){
    fetch('app/versao.json?' + Date.now()).then(function(r){ return r.json(); }).then(function(v){
      if (!v || !(v.versao > APP_VERSAO)) return;
      var ja = ''; try { ja = sessionStorage.getItem('nascer_recarregou') || ''; sessionStorage.setItem('nascer_recarregou', String(v.versao)); } catch(x){}
      if (ja === String(v.versao)) return;
      var limpar = window.caches ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }) : Promise.resolve();
      limpar.catch(function(){}).then(function(){ location.reload(); });
    }).catch(function(){});
  }
})();
</script>
